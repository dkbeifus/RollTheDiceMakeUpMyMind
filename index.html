<html>
    <head>
        <title>CMPA 4303 Project - Daniel Beifus - Roll The Dice Make Up My Mind Page</title>
        <link rel="stylesheet" type="text/css" href="css/style.css">
    </head>
    <body>
        <h1>Roll The Dice, Make Up My Mind!</h1>
        <h2>Site Under Construction</h2>
        <div class="section">
            <label for="choice_list">Choose From These Items</label>
            <textarea class="scrollabletextbox" id="choice_list" placeholder="Enter each choice on a new line"></textarea>
            <button type="button" class="button button_roll" for="choice_list" id="button_roll_the_dice">Roll The Dice</button>
            <button type="button" class="button button_shuffle" for="choice_list" id="button_shuffle">Shuffle Choices</button>
            <button type="button" class="button button_import" for="choice_list" id="button_shuffle">Import From File</button>
            <button type="button" class="button button_export" for="choice_list" id="button_shuffle">Export To File</button>
        </div>
        
        <div class="section">
            <h2>Site Under Construction</h2>
        </div>
    </body>
