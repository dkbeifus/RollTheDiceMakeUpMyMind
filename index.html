<!DOCTYPE html>
    <head>
        <title>CMPA 4303 Project - Daniel Beifus - Roll The Dice Make Up My Mind Page</title>
        <link rel="stylesheet" type="text/css" href="css/style.css">
    </head>
    <body>
        <h1>Roll The Dice, Make Up My Mind!</h1>
        <div id= "aboveGrid_Text" class="above_grid_text"> 
            <br>
            <h2>Have you ever wanted a solution to the never-ending cycle of "I don't know, where do you want to eat?"?</h2>
            <h2>Enter your options (one option per line) in the list below and let the "dice" decide.</h2>
            <h2>Save the list for later and reload it all with the click of a button</h2>
            <button id="add_button" class="above_grid_button" type="button" onclick="addList()">Add Another List</button>
            <button id="remove_button" class="above_grid_button" type="button" onclick="removeList()">Remove Last List</button>
            <h2></h2>
        </div>   
        <div id="diceTray" class="dice_tray">
            <p id="hidden_number" hidden>1</p>
            <div class="choice_area">
                <label class="choice_label" for="choice_list_1">Choose From These Items</label>
                <input class="choice_decision" type="text" id="choice_list_1_choice" name="choice_list_1" value="Roll To Choose" readonly />
                <textarea class="choice_list" id="choice_list_1" name="choice_list_1" placeholder="Enter each choice on a new line"></textarea>
                <div class="choice_button_row">
                    <button type="choice_button" class="button button_roll" for="choice_list" id="button_roll_the_dice" name="choice_list_1" onclick="rollDice(document.getElementById(this.name), document.getElementById(this.name + '_choice'))">Roll The Dice</button>
                    <button type="choice_button" class="button button_shuffle" for="choice_list" id="button_shuffle" name="choice_list_1" onclick="shuffleItems(document.getElementById(this.name))">Shuffle Choices</button>
                    <button type="choice_button" class="button button_import" for="choice_list" id="button_import" name="choice_list_1" onclick="importListFromFile(document.getElementById(this.name), document.getElementById(this.name + '_fileInput'))">Import From File</button>
                    <button type="choice_button" class="button button_export" for="choice_list" id="button_export" name="choice_list_1" onclick="saveListAsFile(document.getElementById(this.name))">Export To File</button>
                    <input type="file" id="choice_list_1_fileInput" accept=".txt" style="display:none;">
                </div>
            </div>
        </div>
        <script src="js/script.js"></script>
    </body>
</html>
